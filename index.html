<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eid Challenge</title>
  </head>
  <body>
    <h3>Task 1: Log Compression System</h3>
    <div id="log-container"></div>

    <h3>Task 2: Subarray with Given Sum</h3>
    <!-- Subarray with Given Sum -->
    <div id="sub-container"></div>

    <h3>Task 3: Maximum Profit</h3>
    <!-- Maximum Profit -->
    <div id="max-container"></div>

    <h3>Task 4: Trap Rain Water</h3>
    <div id="water-container"></div>

    <h3>Task 5: Longest Unique Subarray</h3>
    <div id="unique-container"></div>

    <h3>Task 6: Product of Array Except Self</h3>
    <div id="product-container"></div>
    <script>
      // ========================== Task 1: Log Compression System ==========================
      events = [
        { event: "click", time: 1 },
        { event: "click", time: 2 },
        { event: "scroll", time: 3 },
        { event: "scroll", time: 4 },
        { event: "click", time: 5 },
      ];

      let New_events = []; // to save the result
      let events_countr = 0; // counter
      let current_Event = events[0].event; // to save the current event in the loop
      for (let i = 0; i < events.length; i++) {
        if (events[i].event == current_Event) {
          events_countr++;
        } else {
          New_events[New_events.length] = {
            event: current_Event,
            count: events_countr,
          };
          current_Event = events[i].event;
          events_countr = 1;
        }
      }
      New_events[New_events.length] = {
        event: current_Event,
        count: events_countr,
      };
      console.log(New_events);

      // Print on html Task 1
      let container = document.getElementById("log-container");
      let htmlContent = "<h4>Log Compression System Result:</h4><ul>";

      for (let j = 0; j < New_events.length; j++) {
        htmlContent +=
          "<li>Event: <b>" +
          New_events[j].event +
          "</b> - Count: " +
          New_events[j].count +
          "</li>";
      }

      htmlContent += "</ul>";
      container.innerHTML = htmlContent + "<hr>";

      // ========================== Task 2: Subarray with Given Sum ==========================
      let numbers = [1, 4, 20, 3, 10, 5];
      let target = 33;

      let sum = 0;
      let start = 0;
      let end = 0;
      let found = true;

      for (end; end < numbers.length; end++) {
        sum += numbers[end];
        while (sum > target && start < end) {
          sum -= numbers[start];
          start++;
        }
        if (sum === target) {
          console.log("Start: " + start + ", End: " + end);
          found = true;
          break; // Stop looking if its found
        }
      }

      if (found === false) {
        console.log("No subarray found with the given sum.");
      }

      //   Print task 2 on html
      let subContainer = document.getElementById("sub-container");
      let subHtmlContent = "<h4>Subarray with Given Sum Result:</h4>";
      if (found === true) {
        subHtmlContent += "Start: " + start + ", End: " + end;
      } else {
        subHtmlContent += "No subarray found with the given sum.";
      }
      subContainer.innerHTML = subHtmlContent + "<hr>";

      // ========================= Task 3:  Maximum Profit ==========================
      let prices = [7, 1, 5, 3, 6, 4];

      let maxProfit = 0;
      let minPrice = 1000;

      for (let i = 0; i < prices.length; i++) {
        if (prices[i] < minPrice) {
          minPrice = prices[i];
        }
        let profit = prices[i] - minPrice;
        if (profit > maxProfit) {
          maxProfit = profit;
        }
      }
      console.log(maxProfit);

      // Print task 3 on html
      let maxContainer = document.getElementById("max-container");
      let maxHtmlContent = "<h4>Maximum Profit Result:</h4>";
      maxHtmlContent += "Maximum Profit: " + maxProfit;
      maxContainer.innerHTML = maxHtmlContent + "<hr>";

      // ========================= Task 4: Trap Rain Water ==========================
      let heights = [0, 1, 0, 2, 1, 0, 1, 3, 2, 1, 2, 1];
      
      let maxLeft = [];
      let currentMax = 0;
      for (let i = 0; i < heights.length; i++) {
        maxLeft[i] = currentMax; // Tallest wall seen BEFORE this bar
        if (heights[i] > currentMax) {
          currentMax = heights[i]; // Update the wall for the next bar
        }
      }

      let maxRight = [];
      currentMax = 0;
      for (let i = heights.length - 1; i >= 0; i--) {
        maxRight[i] = currentMax; // Tallest wall seen BEFORE this bar (from the right)
        if (heights[i] > currentMax) {
          currentMax = heights[i];
        }
      }

      let totalWater = 0;
      for (let i = 0; i < heights.length; i++) {
        // the lowest of the two walls
        let waterLevel;

        if (maxLeft[i] < maxRight[i]) {
          waterLevel = maxLeft[i];
        } else {
          waterLevel = maxRight[i];
        }

        // The total trapped water
        if (waterLevel > heights[i]) {
          totalWater += waterLevel - heights[i];
        }
      }
      console.log("Total Trapped Water: " + totalWater);

      // Print task 4 on html
      let waterContainer = document.getElementById("water-container");
      let waterHtmlContent = "<h4>Trap Rain Water Result:</h4>";
      waterHtmlContent += "Total Trapped Water: " + totalWater;
      waterContainer.innerHTML = waterHtmlContent + "<hr>";

      // ========================= Task 5: Longest Unique Subarray ==========================
      let period = [1, 2, 3, 1, 2, 3, 4, 5];
      let left = 0;
      let maxLength = 0;
      let startPoint = 0;
      let bestPeriod = [];

      for (let i = 0; i < period.length; i++) {
        for (let j = left; j < i; j++) {
          if (period[j] === period[i]) {
            left = j + 1;
          }
        }
        let length = i - left + 1;
        if (length > maxLength) {
          maxLength = length;
          startPoint = left;
        }
      }
      for (let i = startPoint; i < startPoint + maxLength; i++) {
        bestPeriod.push(period[i]);
      }
      console.log("Longest Unique Subarray: [" + bestPeriod.join(", ") + "]");

      // Print task 5 on html
      let uniqueContainer = document.getElementById("unique-container");
      let uniqueHtmlContent = "<h4>Longest Unique Subarray Result:</h4>";
      uniqueHtmlContent +=
        "Longest Unique Subarray: [" + bestPeriod.join(", ") + "]";
      uniqueContainer.innerHTML = uniqueHtmlContent + "<hr>";

      // ========================== Task 6: Product of Array Except Self ==========================
      arr = [1, 2, 3, 4];
      productNumbers = [];
      let productSum = 1;

      for (let i = 0; i < arr.length; i++) {
        productSum = 1;
        for (let j = 0; j < arr.length; j++) {
          if (j !== i) {
            productSum *= arr[j];
          }
        }
        productNumbers[i] = productSum;
      }
      console.log(productNumbers);

      // Print task 6 on html
      let productContainer = document.getElementById("product-container");
      let productHtmlContent = "<h4>Product of Array Except Self Result:</h4>";
      productHtmlContent +=
        "Product of Array Except Self: [" + productNumbers.join(", ") + "]";
      productContainer.innerHTML = productHtmlContent + "<hr>";
    </script>
  </body>
</html>
